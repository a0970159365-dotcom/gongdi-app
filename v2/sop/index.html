  <style>
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
    html,body{height:100%;overflow-x:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f3f4f6}
    .btn-status{transition:all .15s;border:2px solid transparent;cursor:pointer}
    .btn-status.s-normal  {background:#16a34a!important;color:#fff!important;border-color:#15803d!important}
    .btn-status.s-abnormal{background:#dc2626!important;color:#fff!important;border-color:#b91c1c!important}
    .btn-status.s-improved{background:#ea580c!important;color:#fff!important;border-color:#c2410c!important}
    .btn-status.s-na      {background:#6b7280!important;color:#fff!important;border-color:#4b5563!important}
    .hidden{display:none!important}
    .view{display:none}
    .view.active{display:block}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
    .toast-wrap{position:fixed;bottom:96px;left:0;right:0;display:flex;justify-content:center;z-index:60;pointer-events:none}
    .toast-msg{background:#1f2937;color:#fff;font-size:.875rem;padding:.5rem 1.25rem;border-radius:9999px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .border-l-normal  {border-left-color:#16a34a!important}
    .border-l-abnormal{border-left-color:#dc2626!important}
    .border-l-improved{border-left-color:#ea580c!important}
    .border-l-na      {border-left-color:#9ca3af!important}
    .badge-n{background:#dcfce7;color:#166534}
    .badge-a{background:#fee2e2;color:#991b1b}
    .badge-i{background:#ffedd5;color:#9a3412}
    .badge-x{background:#f3f4f6;color:#4b5563}
    @media print{
      .no-print{display:none!important}
      body{background:#fff}
      .status-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:9pt;font-weight:600}
      .s-n2{background:#dcfce7;color:#166534}
      .s-a2{background:#fee2e2;color:#991b1b}
      .s-i2{background:#ffedd5;color:#9a3412}
      .s-x2{background:#f3f4f6;color:#4b5563}
    }
    @media (min-width:768px){
      body.wide .max-w-lg.mx-auto.min-h-screen,
      body.wide #top-header,
      body.wide #bottom-nav{max-width:64rem!important}
    }
    /* ── 設定維護權（2026-08-17）──
     * 角色沒勾「維護設定」時，body 掛上 .no-mng：設定頁的新增／儲存鈕（data-mng）收起來，
     * 欄位也改不動。用 CSS 而非逐一 style.display 是因為設定頁會整區重繪，重繪後規則自動生效。*/
    body.no-mng #view-settings [data-mng]{display:none!important}
    body.no-mng #view-settings input,
    body.no-mng #view-settings textarea,
    body.no-mng #view-settings select{pointer-events:none;background:#f3f4f6;color:#6b7280}
  </style>
</head>

var PAGE_TITLES = {
  home:'檢核填寫','new-header':'基本資訊',checklist:'查驗中',

};

function showView(v){
  S.view=v;
  document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
  var el=$('view-'+v);
  if(el) el.classList.add('active');

  // page title
  var title = PAGE_TITLES[v]||'查檢表—標準作業';
  if(v==='checklist' && S.report.templateName) title=S.report.templateName;
  if(v==='detail' && S.selectedReportId){
    var r=S.reports.find(function(x){return x.id===S.selectedReportId;});
    if(r) title=r.caseName;
  }
  $('page-title').textContent=title;

  // back button
  var canBack = S.viewStack.length>1;
  $('btn-back').classList.toggle('hidden', !canBack);
  $('back-placeholder').classList.toggle('hidden', canBack);
  // 動態文字：上一步是歷史資料 → 「返回歷史資料」，其他情況 → 「返回」
  if(canBack){
    var _prev = S.viewStack[S.viewStack.length-2];
    var _lbl = $('btn-back-label');
    if(_lbl) _lbl.textContent = (_prev==='history') ? '返回歷史資料' : '返回';
  }

  // settings button
  $('btn-settings').classList.toggle('hidden', v==='settings');

  // bottom nav
  var showNav = BOTTOM_NAV_VIEWS[v];
  $('bottom-nav').style.display = showNav ? '' : 'none';

  // wide layout for list views (home/history)
  document.body.classList.toggle('wide', v==='home' || v==='history');
  ['home','history','settings'].forEach(function(n){
    var btn=$('nav-'+n);
    btn.className='flex-1 flex flex-col items-center py-2 text-xs transition-colors '+(v===n?'text-blue-700':'text-gray-400');
  });

  window.scrollTo(0,0);

  // render views
  if(v==='home') renderHome();
  if(v==='history') renderHistory();
  if(v==='settings') { renderSettings(); applyMngSettingsUI(); }
  if(v==='detail') renderDetail();
  if(v==='checklist') renderChecklist();
  if(v==='complete') renderComplete();
  if(v==='new-header') renderHeaderForm();
}

/* ── 部門／填表人員：自動帶入登入身分並鎖住（2026-08-13 新增）──
 * 以前這兩欄是可以自己選的下拉，等於誰都能掛別人的名字送出。
 * 現在直接吃入口登入的身分、變灰不可改。
 * 只有在真的抓不到登入身分時才維持可選（本機測試／URL 進來沒帶身分的情況）。 */
function lockIdentityFields(){
  var u = S.currentUser || {};
  var pairs = [['f-person', u.name], ['f-dept', u.dept]];
  pairs.forEach(function(p){
    var el = $(p[0]), val = p[1];
    if(!el) return;
    if(!val){                                   // 抓不到身分 → 保持原本可選，不要把人卡死
      el.disabled = false;
      el.classList.remove('bg-gray-100','text-gray-600','cursor-not-allowed');
      el.removeAttribute('title');
      return;
    }
    // 清單裡沒有這個人／這個部門時補一個選項，否則 value 設不進去會變空白
    var has = Array.prototype.some.call(el.options, function(o){ return o.value === val; });
    if(!has) el.insertAdjacentHTML('beforeend','<option value="'+esc(val)+'">'+esc(val)+'</option>');
    el.value = val;
    el.disabled = true;                          // disabled 的 select 讀 .value 仍讀得到，送出不受影響
    el.classList.add('bg-gray-100','text-gray-600','cursor-not-allowed');
    el.title = '依登入身分自動帶入，不可修改';
  });
  var hint = $('identity-hint');
  if(hint) hint.classList.toggle('hidden', !(u.name));
}

function statusBtn(idx,label,current){
  var map={'正常':'s-normal','不正常':'s-abnormal','改善後合格':'s-improved','未列入':'s-na'};
  var shortLabel={'正常':'正常','不正常':'不正常','改善後合格':'改善合格','未列入':'未列入'}[label]||label;
  var cls='btn-status py-3 text-xs font-semibold rounded-xl bg-gray-100 text-gray-600 w-full '+(current===label?map[label]:'');
  return '<button class="'+cls+'" onclick="setStatus('+idx+',\''+label+'\')">'+shortLabel+'</button>';
}

function setStatus(idx,s){
  S.report.items[idx].status=s;
  // #4：狀況說明 + 拍照/上傳 對所有狀況（正常/不正常/改善後合格/未列入）一律開放，
  // 不再依狀態隱藏，也不清空已填內容；僅動態提示「不正常」時狀況說明為必填
  var descEl=$('item-desc-'+idx);
  if(descEl) descEl.placeholder=(s==='不正常'?'狀況說明（必填）':'狀況說明');

  // update card border
  var cards=$('checklist-items').querySelectorAll('.border-l-4');
  if(cards[idx]){
    ['border-l-normal','border-l-abnormal','border-l-improved','border-l-na','border-gray-200'].forEach(function(c){ cards[idx].classList.remove(c); });
    var bc=borderClass(s);
    if(bc) cards[idx].classList.add(bc); else cards[idx].classList.add('border-gray-200');
  }

  // update buttons
  var grid=cards[idx].querySelectorAll('.btn-status');
  var labels=['正常','不正常','改善後合格','未列入'];
  var map2={'正常':'s-normal','不正常':'s-abnormal','改善後合格':'s-improved','未列入':'s-na'};
  grid.forEach(function(btn,i){
    ['s-normal','s-abnormal','s-improved','s-na'].forEach(function(c){ btn.classList.remove(c); });
    if(labels[i]===s) btn.classList.add(map2[s]);
  });

  updateProgress();
  updateCompleteBtn();
}

function setDesc(idx,v){ S.report.items[idx].description=v; }

function updateProgress(){
  var done=S.report.items.filter(function(i){return i.status;}).length;
  var total=S.report.items.length;
  var pct=total?Math.round(done/total*100):0;
  $('cl-progress-text').textContent=done+' / '+total;
  $('cl-progress-bar').style.width=pct+'%';
  $('cl-progress-pct').textContent=pct+'% 完成';
}

function updateCompleteBtn(){
  var done=S.report.items.filter(function(i){return i.status;}).length;
  var total=S.report.items.length;
  var btn=$('btn-complete');
  if(done===total){
    btn.className='w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-2xl shadow-md text-base';
    btn.textContent='✓ 完成查驗';
  } else {
    btn.className='w-full bg-gray-200 text-gray-400 font-bold py-3 rounded-2xl text-base';
    btn.textContent='還有 '+(total-done)+' 項未查驗';
  }
}

function handlePhoto(e,idx){
  var file=e.target.files[0]; if(!file) return;
  resizeImg(file,600,function(dataUrl){
    S.report.items[idx].photo=dataUrl;
    S.report.items[idx].photoThumb=dataUrl;
    renderChecklist();
  });
}
function removePhoto(idx){
  S.report.items[idx].photo=null;
  S.report.items[idx].photoThumb=null;
  renderChecklist();
}
function resizeImg(file,maxW,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var r=Math.min(1,maxW/img.width);
      var c=document.createElement('canvas');
      c.width=img.width*r; c.height=img.height*r;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.72));
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function saveAsDraft(){
  S.report.status='draft';

  showToast('草稿已儲存');
}
function scrollToItem(idx){
  var cards=$('checklist-items').querySelectorAll('.border-l-4');
  if(cards[idx]) cards[idx].scrollIntoView({behavior:'smooth',block:'center'});
}
function completeReport(){
  // #5：填表人需全部完成勾選；未勾選明確指出漏項；「不正常」須填狀況說明
  var noStatus=[], noDesc=[];
  S.report.items.forEach(function(i,idx){
    if(!i.status){ noStatus.push(idx+1); }
    else if(i.status==='不正常' && !(i.description||'').trim()){ noDesc.push(idx+1); }
  });
  if(noStatus.length){
    showToast('尚有 '+noStatus.length+' 項未查驗：第 '+noStatus.join('、')+' 項');
    scrollToItem(noStatus[0]-1);
    return;
  }
  if(noDesc.length){
    showToast('第 '+noDesc.join('、')+' 項為「不正常」，請填寫狀況說明');
    scrollToItem(noDesc[0]-1);
    return;
  }
  S.report.status='completed';
  persistReport();
  goTo('complete');
}
function persistReport(){
  var data=JSON.parse(JSON.stringify(S.report));
  data.createdAt=Date.now();
  var idx=S.reports.findIndex(function(r){return r.id===data.id;});
  if(idx>=0) S.reports.splice(idx,1,data); else S.reports.push(data);
  saveLS();
  if(window._sopSet){
    setSyncStatus('saving');
    window._sopSet('reports/'+data.id, data).then(function(){ setSyncStatus('saved'); }).catch(function(){ setSyncStatus('error'); });
  }
}

function renderHistory(){
  // fill filter template select
  var sel=$('h-filter-tpl');
  if(sel.options.length<=1){
    // 已作廢的工法也要留在篩選清單裡，否則舊報表篩不到
    TEMPLATES.forEach(function(t){ sel.innerHTML+='<option value="'+t.id+'">'+esc(t.name)+(t.void?'（已作廢）':'')+'</option>'; });
  }
  // 案場篩選（2026-08-13 新增）：選項直接從現有報表長出來，每次重繪都更新但保留使用者當下的選擇
  var csel=$('h-filter-case');
  var mine=[].concat(visibleReports());
  var cases=[]; mine.forEach(function(r){ var c=r.caseName||''; if(c&&cases.indexOf(c)<0)cases.push(c); });
  cases.sort();
  var keep=csel.value;
  csel.innerHTML='<option value="">全部案場</option>'
    +cases.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join('');
  if(cases.indexOf(keep)>=0) csel.value=keep;   // 選的案場還在就保留，被篩掉就退回「全部」

  var ft=sel.value, fs=$('h-filter-status').value, fc=csel.value;
  var list=mine
    .filter(function(r){ return (!ft||r.templateId===ft)&&(!fs||r.status===fs)&&(!fc||r.caseName===fc); })
    .sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});

  if(list.length===0){
    $('history-list').innerHTML='<div class="text-center py-12 text-gray-400"><div class="text-4xl mb-3">📭</div><div class="text-sm">沒有符合的記錄</div></div>';
    return;
  }
  $('history-list').innerHTML=list.map(function(r){
    return '<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hover:shadow-md transition-all">'
      +'<div class="flex items-start gap-3">'
      +'<div onclick="openReportForEdit(\''+r.id+'\')" class="w-10 h-10 rounded-xl flex items-center justify-center text-xl flex-shrink-0 cursor-pointer" style="'+tplBg(r.templateId)+'">'+tplIcon(r.templateId)+'</div>'
      +'<div onclick="openReportForEdit(\''+r.id+'\')" class="flex-1 min-w-0 cursor-pointer">'
      +'<div class="flex items-center justify-between">'
      +'<span class="font-semibold text-gray-800 text-sm truncate">'+esc(r.caseName)+'</span>'
      +'<span class="text-xs flex-shrink-0 ml-2 '+(r.status==='completed'?'text-green-600':'text-amber-600')+'">'+(r.status==='completed'?'✓ 完成':'草稿')+'</span>'
      +'</div>'
      +'<div class="text-xs text-gray-500 mt-1 truncate">'+esc(r.templateName)+'</div>'
      +'<div class="text-xs text-gray-400 mt-1">'+esc(r.date)+' · '+esc(r.personnel)+'</div>'
      +'</div>'
      +'<div class="flex flex-col gap-1 flex-shrink-0 ml-2">'
      +'<button onclick="openReportForEdit(\''+r.id+'\')" class="px-3 py-1 text-xs bg-blue-600 text-white rounded-lg hover:bg-blue-700 whitespace-nowrap">📂 開啟</button>'
      +(portalCanDelete()?'<button onclick="deleteReportFromHistory(\''+r.id+'\')" class="px-3 py-1 text-xs bg-red-100 text-red-600 rounded-lg hover:bg-red-200 whitespace-nowrap">🗑️ 刪除</button>':'')
      +'</div>'

function switchTplEditor(tplId){ S.editingTplId = tplId; renderTemplatesSection(); }
function addTplItem(tplId){
  if(mngGuard())return;
  var tpl = TEMPLATES.find(function(t){ return t.id === tplId; });
  if(!tpl) return;
  if(!tpl.items) tpl.items = [];
  tpl.items.push({ id: uid(), name: '', criterion: '' });
  syncTemplatesToConfig();
  renderTemplatesSection();
}
function removeTplItem(tplId, itemId){
  if(mngGuard())return;
  if(!requireDelete()) return;
  if(!confirm('確定刪除此查驗項目？\n（既有歷史報表為快照儲存，不會受影響）')) return;
  var tpl = TEMPLATES.find(function(t){ return t.id === tplId; });
  if(!tpl || !tpl.items) return;
  tpl.items = tpl.items.filter(function(it){ return it.id !== itemId; });
  syncTemplatesToConfig();
  renderTemplatesSection();
}
function updateTplItem(tplId, itemId, field, value){
  var tpl = TEMPLATES.find(function(t){ return t.id === tplId; });
  if(!tpl || !tpl.items) return;
  var item = tpl.items.find(function(it){ return it.id === itemId; });
  if(!item) return;
  item[field] = value;
  syncTemplatesToConfig();
}
function addTemplate(){
  if(mngGuard())return;
  var newTpl = { id: uid(), name: '新工法', materialLabel: '材質', icon: '📋', items: [] };
  TEMPLATES.push(newTpl);
  S.editingTplId = newTpl.id;
  syncTemplatesToConfig();
  renderTemplatesSection();
}
/* ── 複製工法（2026-08-13 新增）──
 * 整份複製：名稱、材質標籤、圖示、所有查驗項目與準則都帶過去。
 * 每個項目都給新 id，否則兩個工法共用同一個項目 id，改一邊會動到另一邊。 */
function duplicateTemplate(tplId){
  if(mngGuard())return;
  var tpl = TEMPLATES.find(function(t){ return t.id === tplId; });
  if(!tpl) return;
  if(!confirm('要複製工法「'+tpl.name+'」嗎？\n（'+(tpl.items||[]).length+' 個查驗項目會一起複製過去）')) return;
  var copy = {
    id: uid(),
    name: tpl.name + '（複本）',
    materialLabel: tpl.materialLabel,
    icon: tpl.icon,
    items: (tpl.items||[]).map(function(it){
      return { id: uid(), name: it.name, criterion: it.criterion || '' };
    })
  };
  TEMPLATES.push(copy);
  S.editingTplId = copy.id;
  syncTemplatesToConfig();
  renderTemplatesSection();
  showToast('已複製 — 請改名後儲存設定');
}
/* ── 作廢／恢復（2026-08-13 新增）──
 * 作廢＝停用不刪除：首頁選不到、不能新建；既有歷史報表為快照儲存，完全不受影響。
 * 用 void 旗標而不是真的刪掉，隨時可恢復，也不會讓歷史報表的工法名稱變成孤兒。 */
function voidTemplate(tplId){
  if(mngGuard())return;
  var tpl = TEMPLATES.find(function(t){ return t.id === tplId; });
  if(!tpl) return;
  var live = TEMPLATES.filter(function(t){ return !t.void; });
  if(live.length <= 1){ alert('至少要保留一個可用的工法，無法全部作廢。'); return; }
  if(!confirm('確定把工法「'+tpl.name+'」設為作廢？\n\n・首頁不會再出現，無法新建這個工法的報表\n・既有歷史報表照常顯示、可列印\n・之後隨時可以在這裡按「恢復使用」')) return;
  tpl.void = true;
  syncTemplatesToConfig();
  renderTemplatesSection();
  showToast('已作廢 — 記得拉到最下方按「儲存設定」');
}
function restoreTemplate(tplId){
  if(mngGuard())return;
  var tpl = TEMPLATES.find(function(t){ return t.id === tplId; });
  if(!tpl) return;
  delete tpl.void;
  syncTemplatesToConfig();
  renderTemplatesSection();
  showToast('已恢復使用 — 記得拉到最下方按「儲存設定」');
}
/* 首頁／新建流程只吃「沒作廢」的工法；歷史與列印一律吃全部（含已作廢） */
function liveTemplates(){ return TEMPLATES.filter(function(t){ return !t.void; }); }
function updateTemplate(tplId, field, value){
  var tpl = TEMPLATES.find(function(t){ return t.id === tplId; });
  if(!tpl) return;
  tpl[field] = value;
  syncTemplatesToConfig();
}
function removeTemplate(tplId){
  if(mngGuard())return;
  if(!requireDelete()) return;
  if(TEMPLATES.length <= 1){ alert('至少需保留一個工法'); return; }
  var tpl = TEMPLATES.find(function(t){ return t.id === tplId; });
  if(!tpl) return;
  if(!confirm('確定刪除工法「' + tpl.name + '」？\n（既有歷史報表為快照儲存，仍會正常顯示；只是無法再新建此工法的報表）')) return;
  var idx = TEMPLATES.findIndex(function(t){ return t.id === tplId; });
  TEMPLATES.splice(idx, 1);
  S.editingTplId = TEMPLATES[0] ? TEMPLATES[0].id : null;
  syncTemplatesToConfig();
  renderTemplatesSection();
}
function removeCfgItem(key,idx){
  if(mngGuard())return;
  if(!requireDelete()) return;
  S.config[key].splice(idx,1);
  renderSettings();
}
function saveConfig(){
  if(mngGuard())return;
  saveLS();
  if(window._sopSet){
    window._sopSet('config', S.config).then(function(){ showToast('設定已儲存並同步'); }).catch(function(){ showToast('設定已存本機'); });
  } else {
    showToast('設定已儲存');
  }
}
function syncNow(){

// ====== PORTAL INTEGRATION ======
// 從入口網頁同步 部門/人員 清單（如有），並抓當前登入身分預填表單
function syncFromPortal(){
  try {
    var portal = JSON.parse(localStorage.getItem('portal_v1')||'{}');
    if (portal.departments && portal.departments.length) {
      S.config.departments = portal.departments.map(function(d){return d.name;});
    }
    if (portal.employees && portal.employees.length) {
      S.config.personnel = portal.employees.map(function(e){return e.name;});
    }
    // 預填表單填寫人 + 帶入權限範圍（檢視 / 編輯 / 跨部門互看清單）
    if (portal.currentUser && portal.currentUser.name) {
      var cu = portal.currentUser;
      var vLevel='dept', eLevel='self', cDepts=[];
      try {
        var role = (portal.roles||[]).find(function(x){return x.id===cu.roleId;});
        if (role) { vLevel=role.level||'dept'; eLevel=role.editLevel||'self'; cDepts=role.crossDepts||[]; }
      } catch(e){}
      S.currentUser = { name: cu.name, dept: cu.dept || '', viewLevel:vLevel, editLevel:eLevel, crossDepts:cDepts };
    }
  } catch(e){}
  // URL 參數 fallback
  if (!S.currentUser) {
    var p = new URLSearchParams(location.search);
    var n = p.get('user');
    if (n) S.currentUser = { name:n, dept:p.get('dept')||'', viewLevel:'dept', editLevel:'self', crossDepts:[] };
  }
}

// ====== 權限執行層（依入口角色的檢視/編輯範圍，欄位＝department / personnel） ======
function canViewReport(r){
  var u=S.currentUser||{}; var level=u.viewLevel||'dept';
  if(level==='all') return true;
  // 保險：填表人為本人的報表，不論部門一律可見（避免「自己建完卻超出檢視範圍而找不到」）
  if(r && r.personnel && u.name && r.personnel===u.name) return true;
  if(!r||!r.department) return true;              // 沒標部門的舊資料一律可見
  if(level==='dept') return r.department===u.dept;
  if(level==='cross') return r.department===u.dept || (u.crossDepts||[]).indexOf(r.department)>=0;
  if(level==='self') return r.personnel===u.name;
  return r.department===u.dept;
}
function visibleReports(){ return S.reports.filter(canViewReport); }
function canEditReport(r){
  var u=S.currentUser||{};
  if(!r||!r.department) return true;
  var el=u.editLevel||'self';
  if(el==='none') return false;
  if(el==='all') return true;
  if(el==='dept') return r.department===u.dept;
  if(el==='cross') return r.department===u.dept || (u.crossDepts||[]).indexOf(r.department)>=0;
  return r.personnel===u.name;                    // self：填表人為本人
}

// ====== 登入閘門 ======
// 進站條件（兩個都要成立）：
// ① sessionStorage 有入口的分頁工作階段 —— 由入口登入後在同一分頁跳過來才會有，
//    關掉分頁或直接開本頁網址都沒有 → 擋下（URL 參數 ?user=XXX 也不算數）
// ② localStorage portal_v1.currentUser 有登入身分（入口登出會清掉）
/* ── 刪除權（2026-08-12）──
 * 入口的權限設定可以逐一角色勾「可刪除資料」。沒勾的人，刪除鈕直接不渲染出來，
 * 用途是避免同仁誤刪共用設定（工法／案場／施工廠商／查驗項目）與歷史報表。
 * 刻意不含「正在填的這張查檢表裡移除剛拍的照片」——那是填表過程，鎖了沒法用。
 * ⚠️ 這是畫面層防呆，擋不住直接對資料庫發請求的人；真正的鎖要等 F 版伺服器端驗證。
 */
function portalCanDelete(){
  try{
    var p = JSON.parse(localStorage.getItem('portal_v1')||'{}');
    var u = p.currentUser; if(!u || !u.roleId) return false;
    var r = (p.roles||[]).find(function(x){ return x.id === u.roleId; });
    return !!(r && r.canDelete);
  }catch(e){ return false; }
}
function requireDelete(){
  if(portalCanDelete()) return true;
  showToast('只有具備刪除權的角色可以刪除，請聯絡系統管理員');
  return false;
}

/* ── 設定維護權（2026-08-17）────────────────────────────────────────
 * 入口的權限設定可以逐一角色勾「維護設定」。沒勾的人進系統設定頁只能看：
 * 清單照常顯示（要查「有沒有這家廠商」查得到），但「＋ 新增」「儲存設定」不出現、欄位也改不動。
 * 用途是避免同仁誤加共用清單（案場／施工廠商／工法／查驗項目）。
 * 舊資料還沒有這個欄位時，比照入口的遷移規則（名稱含「主管」或看全公司）判斷，避免主管突然被擋。
 * ⚠️ 這是畫面層防呆，擋不住直接對資料庫發請求的人；真正的鎖要等 F 版伺服器端驗證。
 */
function portalCanManageSettings(){
  try{
    var p = JSON.parse(localStorage.getItem('portal_v1')||'{}');
    var u = p.currentUser; if(!u || !u.roleId) return false;
    var r = (p.roles||[]).find(function(x){ return x.id === u.roleId; });
    if(!r) return false;
    if(typeof r.canManageSettings !== 'boolean') return /主管/.test(r.name||'') || r.level === 'all';
    return !!r.canManageSettings;
  }catch(e){ return false; }
}
function requireManageSettings(){
  if(portalCanManageSettings()) return true;
  showToast('你的角色只能檢視設定，不能新增或修改。需要開通請找主管或系統管理員');
  return false;
}
/* 寫入類動作的統一守門：回 true 代表「已擋下」，呼叫端直接 return */
function mngGuard(){ return !requireManageSettings(); }
/* 設定頁唯讀提示條 + 切換 body.no-mng（收掉 data-mng 按鈕、鎖住欄位） */
function applyMngSettingsUI(){
  var can = portalCanManageSettings();
  document.body.classList.toggle('no-mng', !can);
  var host = document.getElementById('view-settings');
  if(!host) return;
  var bar = document.getElementById('mng-notice');
  if(can){ if(bar) bar.remove(); return; }
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'mng-notice';
    bar.className = 'no-print';
    bar.style.cssText = 'background:#fef3c7;border:1px solid #f59e0b;border-radius:16px;color:#92400e;'
      + 'font-weight:700;font-size:13px;padding:12px 14px;line-height:1.7';
    bar.innerHTML = '👁️ 設定唯讀 — 您可以查看目前有哪些案場、廠商、工法，但無法變更或修改。'
      + '<br><span style="font-weight:500;font-size:12.5px">如需變更，請洽主管或系統管理員。</span>';
  }
  if(bar.parentNode !== host) host.insertBefore(bar, host.firstChild);
}

function portalLoggedIn(){
  try {
    if (sessionStorage.getItem('portal_session') !== '1') return false;
    var p = JSON.parse(localStorage.getItem('portal_v1')||'{}');
    return !!(p.currentUser && p.currentUser.name);
  } catch(e){ return false; }
}

/* ── 使用權限閘門（2026-08-13 新增）──────────────────────────────────
 * 入口網頁只是把沒開通的卡片變灰，知道網址的人直接貼網址照樣進得來。
 * 這裡在子 App 自己再檢查一次：依 window.APP_KEY 讀登入者的 appAccess，
 * 沒開通（或已離職停用）就蓋上擋門，不初始化任何內容。
 * ⚠️ 這仍是「畫面層」控管——資料庫規則目前對外開放，真正的伺服器端驗證要等 F 版。
 * 查不到員工資料時一律放行，避免資料缺漏把人鎖在門外。 */
function portalAppAllowed(){
  try{
    var key = window.APP_KEY || '';
    if (!key) return true;
    var p = JSON.parse(localStorage.getItem('portal_v1')||'{}');
    var u = p.currentUser;
    if (!u) return true;
    var emps = p.employees || [];
    var emp = emps.filter(function(e){ return e && e.id === u.id; })[0]
           || emps.filter(function(e){ return e && e.name === u.name; })[0];
    if (!emp) return true;                                  // 查無此人 → 放行，交給入口控管
    var d = new Date(), pad = function(n){ return (n<10?'0':'')+n; };
    var today = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if (emp.resignDate && today > emp.resignDate) return false;         // 離職停用 → 全鎖
    return !(emp.appAccess && emp.appAccess[key] === false);
  }catch(e){ return true; }
}
function showNoAccessGate(){
  var g = document.getElementById('app-access-gate');
  if (!g) {
    g = document.createElement('div');
    g.id = 'app-access-gate';
    g.style.cssText = 'position:fixed;inset:0;z-index:100000;display:flex;align-items:center;'
      + 'justify-content:center;padding:20px;overflow-y:auto;'
      + 'background:linear-gradient(135deg,#0f172a 0%,#334155 55%,#0f172a 100%)';
    var nm = (document.title||'本系統').replace(/（測試版）/g,'');
    g.innerHTML = '<div style="background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.45);'
      + 'max-width:360px;width:100%;padding:32px 26px;text-align:center;margin:auto">'
      + '<div style="font-size:50px;margin-bottom:8px">🚫</div>'
      + '<div style="font-size:18px;font-weight:800;color:#b91c1c;margin-bottom:10px">沒有這個系統的使用權限</div>'
      + '<div style="font-size:13px;color:#64748b;line-height:1.8;margin-bottom:22px">你的帳號尚未開通<br>'
      + '<strong>「' + nm + '」</strong><br>需要使用請洽系統管理員</div>'
      + '<a href="../portal/index.html" style="display:block;background:#334155;color:#fff;font-weight:800;'
      + 'font-size:14.5px;text-decoration:none;padding:11px;border-radius:9px">← 回入口網頁</a></div>';
    document.body.appendChild(g);
  }
  g.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function enforcePortalLogin(){
  if (portalLoggedIn()) {
    if (!portalAppAllowed()) { showNoAccessGate(); return false; }   // 沒開通這支 App → 擋下
    document.getElementById('portal-gate').style.display='none'; return true;
  }
  document.getElementById('portal-gate').style.display='flex';
  document.body.style.overflow='hidden';
  return false;
}

// ====== INIT ======
(function init(){
  // load local
  var local=loadLS();
  if(local){
    if(local.config) { ['cases','departments','personnel','contractors','templates'].forEach(function(k){ if(local.config[k]) S.config[k]=local.config[k]; }); }
    if(local.reports) S.reports=local.reports;
  }
  syncFromPortal();  // 從入口拉最新部門/人員 + 帶入登入身分
  if (!enforcePortalLogin()) return;  // 未從入口登入 → 顯示閘門，不初始化任何內容
  syncTemplatesFromConfig();
  syncTemplatesToConfig();

  // load Firebase
  if(window._sopGet){
    Promise.all([window._sopGet('config'), window._sopGet('reports')]).then(function(res){
      var fbCfg=res[0], fbRpts=res[1];
      if(fbCfg){
        ['cases','departments','personnel','contractors','templates'].forEach(function(k){ if(fbCfg[k]) S.config[k]=fbCfg[k]; });
        syncTemplatesFromConfig();
      }
      if(fbRpts){
        var cloud=Object.values(fbRpts);
        cloud.forEach(function(r){
          var idx=S.reports.findIndex(function(x){return x.id===r.id;});
          if(idx>=0){ if((r.createdAt||0)>(S.reports[idx].createdAt||0)) S.reports.splice(idx,1,r); }
          else S.reports.push(r);
        });
      }
      saveLS();
      setSyncStatus('saved');
      renderHome();
    }).catch(function(e){ console.warn('Firebase load err:',e); });
  }

  // bind header buttons
  document.getElementById('btn-back').addEventListener('click', goBack);
  document.getElementById('btn-settings').addEventListener('click', function(){ goTo('settings'); });

  // render initial view
  showView('home');
})();
</script>
<!-- ══════ 版本檢查：偵測到新版就跳橫幅，由使用者自己點更新（2026-07-30 新增） ══════ -->
<script>
(function(){
  var MY_VER = window.APP_VERSION || '';
  var MY_KEY = window.APP_KEY || '';
  if (!MY_VER) return;                       // 沒埋版本標記就整個不啟用
  var snoozeUntil = 0;                       // 按 ✕ 後暫停提示到這個時間（重要更新不受影響）
  var barCritical = false;                   // 目前這條橫幅是不是「重要更新」
  var styleAdded = false;
  var FONT = "-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif";

  // 橫幅是 fixed top:0，而導覽列多半是 sticky top:0 → 不處理會蓋住 nav 上的按鈕。
  // 顯示橫幅時把內容與 sticky 導覽列往下推，關掉時還原。
  var savedLayout = null;
  function shiftLayout(bar){
    if (!window.getComputedStyle || !document.querySelectorAll) return;
    var h = bar.offsetHeight || 44;
    var body = document.body;
    if (!body) return;
    var cur = parseFloat(window.getComputedStyle(body).paddingTop) || 0;
    savedLayout = { bodyPad: body.style.paddingTop, navs: [] };
    body.style.paddingTop = (cur + h) + 'px';
    var els = document.querySelectorAll('nav');
    for (var i = 0; i < els.length; i++) {
      var pos = window.getComputedStyle(els[i]).position;
      if (pos === 'sticky' || pos === 'fixed') {
        savedLayout.navs.push({ el: els[i], top: els[i].style.top });
        els[i].style.top = h + 'px';
      }
    }
  }
  function unshiftLayout(){
    if (!savedLayout) return;
    if (document.body) document.body.style.paddingTop = savedLayout.bodyPad;
    for (var i = 0; i < savedLayout.navs.length; i++)
      savedLayout.navs[i].el.style.top = savedLayout.navs[i].top;
    savedLayout = null;
  }

  function addStyle(){
    if (styleAdded) return;
    styleAdded = true;
    var st = document.createElement('style');
    st.textContent =
      '#app-update-bar{position:fixed;top:0;left:0;right:0;z-index:99999;'
      + 'background:linear-gradient(90deg,#f59e0b,#f97316);color:#fff;font:600 14px/1.4 ' + FONT + ';'
      + 'padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:10px;'
      + 'box-shadow:0 2px 10px rgba(0,0,0,.25)}'
      + '#app-update-bar.crit{background:linear-gradient(90deg,#dc2626,#b91c1c)}'
      + '#app-update-bar button{font:inherit;border:0;border-radius:6px;padding:6px 14px;cursor:pointer}'
      + '#app-update-bar .go{background:#fff;color:#b45309}'
      + '#app-update-bar.crit .go{color:#b91c1c}'
      + '#app-update-bar .later{background:transparent;color:#fff;opacity:.85;padding:6px 9px;font-size:16px}'
      + '@media(max-width:480px){#app-update-bar{font-size:13px;flex-wrap:wrap;gap:8px}}'
      + '@media print{#app-update-bar{display:none!important}}';
    document.head.appendChild(st);
  }

  function showBar(newVer, must){
    var old = document.getElementById('app-update-bar');
    if (old) {
      // 已經有一般橫幅、後來才發現是重要更新 → 升級（否則直接跳過）
      if (must && !barCritical) { old.remove(); unshiftLayout(); }
      else return;
    }
    if (!must && Date.now() < snoozeUntil) return;   // 重要更新不受 ✕ 的暫停影響
    barCritical = !!must;
    addStyle();
    var bar = document.createElement('div');
    bar.id = 'app-update-bar';
    if (must) bar.className = 'crit';
    var msg = document.createElement('span');
    msg.textContent = must ? '⚠️ 重要更新，請立即載入新版' : '🔄 系統已更新，請載入新版';
    var go = document.createElement('button');
    go.className = 'go';
    go.textContent = '立即更新';
    go.onclick = function(){
      // 重載會丟掉未存檔的內容（日報表／查檢表填一半最有感）→ 先問過再更新
      if (window.confirm && !window.confirm('更新會重新載入頁面，未存檔的內容會遺失。\n\n確定要現在更新嗎？')) return;
      try {
        // 換 URL（帶新版本號）才能真正繞過瀏覽器快取；保留原有的 query 參數與 hash
        var u = new URL(location.href);
        u.searchParams.set('v', newVer);
        location.href = u.href;
      } catch(e){ location.reload(); }
    };
    bar.appendChild(msg); bar.appendChild(go);
    if (!must) {                               // 只有一般更新才給關；重要更新不給關
      var later = document.createElement('button');
      later.className = 'later';
      later.textContent = '✕';
      later.title = '暫時關閉提示（10 分鐘後再提醒）';
      later.onclick = function(){ bar.remove(); unshiftLayout(); snoozeUntil = Date.now() + 10 * 60 * 1000; };
      bar.appendChild(later);
    }
    (document.body || document.documentElement).appendChild(bar);
    shiftLayout(bar);                          // 橫幅不遮住導覽列與內容
  }

  function check(){
    var url;
    try { url = new URL('../version.json', location.href).href; } catch(e){ return; }
    fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j) return;
        var v = (j.apps && j.apps[MY_KEY]) || j.version;
        if (!v || v === MY_VER) return;
        // critical：true＝所有 App 都算重要；陣列＝只有列到的 App 算重要（改到資料寫入方式才標）
        var c = j.critical;
        var must = c === true ||
                   (Object.prototype.toString.call(c) === '[object Array]' && c.indexOf(MY_KEY) > -1);
        showBar(v, must);
      })
      .catch(function(){});                  // 離線／抓不到 → 安靜略過，不影響使用
  }

  // 頁尾版本字樣＝直接吃 APP_VERSION，不再手寫死字串（只有入口頁有這個元素）
  function stampFooter(){
    var el = document.getElementById('app-ver-txt');
    if (el) el.textContent = MY_VER;
  }
  function boot(){ stampFooter(); check(); }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  setInterval(check, 15 * 60 * 1000);        // 長時間開著的分頁也會發現新版
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
})();
</script>
